apiVersion: v1
kind: Namespace
metadata:
  name: qe-v06-workflows
---
apiVersion: v1
kind: Pod
metadata:
  name: qe-v06-port
  namespace: qe-v06-workflows
  labels:
    app: qe-v06-port
spec:
  containers:
    - name: web
      image: httpd:2.4-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: qe-v06-port-svc
  namespace: qe-v06-workflows
spec:
  selector:
    app: qe-v06-port
  ports:
    - name: http
      port: 8080
      targetPort: 80
