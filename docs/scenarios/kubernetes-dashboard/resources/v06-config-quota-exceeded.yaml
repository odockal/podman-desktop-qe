apiVersion: v1
kind: Pod
metadata:
  name: qe-v06-quota-exceeded
  namespace: qe-v06-workflows
spec:
  restartPolicy: Never
  containers:
    - name: exceeds-quota
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "3"
        limits:
          cpu: "5"
