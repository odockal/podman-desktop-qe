apiVersion: v1
kind: Namespace
metadata:
  name: qe-v06-workflows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qe-v06-network-web
  namespace: qe-v06-workflows
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qe-v06-network-web
  template:
    metadata:
      labels:
        app: qe-v06-network-web
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: qe-v06-network-svc
  namespace: qe-v06-workflows
spec:
  selector:
    app: qe-v06-network-web
  ports:
    - name: http
      port: 8080
      targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: qe-v06-network-endpoint
  namespace: qe-v06-workflows
subsets:
  - addresses:
      - ip: 10.0.0.1
    ports:
      - name: http
        port: 8080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: qe-v06-network-slice
  namespace: qe-v06-workflows
  labels:
    kubernetes.io/service-name: qe-v06-network-svc
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8080
endpoints:
  - addresses:
      - 10.0.0.1
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qe-v06-network-policy
  namespace: qe-v06-workflows
spec:
  podSelector:
    matchLabels:
      app: qe-v06-network-web
  policyTypes:
    - Ingress
    - Egress
