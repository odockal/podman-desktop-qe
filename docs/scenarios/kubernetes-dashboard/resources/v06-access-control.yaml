apiVersion: v1
kind: ServiceAccount
metadata:
  name: qe-v06-reader
  namespace: qe-v06-workflows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qe-v06-reader
  namespace: qe-v06-workflows
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qe-v06-reader
  namespace: qe-v06-workflows
subjects:
  - kind: ServiceAccount
    name: qe-v06-reader
    namespace: qe-v06-workflows
roleRef:
  kind: Role
  name: qe-v06-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qe-v06-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qe-v06-node-reader
subjects:
  - kind: ServiceAccount
    name: qe-v06-reader
    namespace: qe-v06-workflows
roleRef:
  kind: ClusterRole
  name: qe-v06-node-reader
  apiGroup: rbac.authorization.k8s.io
