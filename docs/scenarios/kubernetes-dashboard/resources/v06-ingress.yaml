apiVersion: v1
kind: Namespace
metadata:
  name: qe-v06-workflows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qe-v06-hello
  namespace: qe-v06-workflows
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qe-v06-hello
  template:
    metadata:
      labels:
        app: qe-v06-hello
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: qe-v06-hello-svc
  namespace: qe-v06-workflows
spec:
  selector:
    app: qe-v06-hello
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qe-v06-hello-ingress
  namespace: qe-v06-workflows
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /hello
            pathType: Prefix
            backend:
              service:
                name: qe-v06-hello-svc
                port:
                  number: 80
