apiVersion: v1
kind: Namespace
metadata:
  name: qe-v06-workflows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qe-v06-gateway-web
  namespace: qe-v06-workflows
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qe-v06-gateway-web
  template:
    metadata:
      labels:
        app: qe-v06-gateway-web
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: qe-v06-gateway-svc
  namespace: qe-v06-workflows
spec:
  selector:
    app: qe-v06-gateway-web
  ports:
    - name: http
      port: 8080
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: qe-v06-gateway-class
spec:
  controllerName: example.com/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: qe-v06-gateway
  namespace: qe-v06-workflows
spec:
  gatewayClassName: qe-v06-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qe-v06-http-route
  namespace: qe-v06-workflows
spec:
  parentRefs:
    - name: qe-v06-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: qe-v06-gateway-svc
          port: 8080
