apiVersion: v1
kind: Namespace
metadata:
  name: qe-v06-ns2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qe-v06-default-web
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qe-v06-default-web
  template:
    metadata:
      labels:
        app: qe-v06-default-web
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: qe-v06-default-pod
  namespace: default
  labels:
    app: qe-v06-default-pod
spec:
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qe-v06-default-daemon
  namespace: default
spec:
  selector:
    matchLabels:
      app: qe-v06-default-daemon
  template:
    metadata:
      labels:
        app: qe-v06-default-daemon
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
