  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qe-v06-default-replicaset
  template:
    metadata:
      labels:
        app: qe-v06-default-replicaset
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: Deployment
