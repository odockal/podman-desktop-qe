apiVersion: v1
kind: Namespace
metadata:
  name: qe-v06-workflows
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: qe-v06-stateful-manual
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qe-v06-stateful-pv-0
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: qe-v06-stateful-manual
  claimRef:
    namespace: qe-v06-workflows
    name: qe-v06-stateful-data-qe-v06-stateful-0
  hostPath:
    path: /tmp/qe-v06-stateful-0
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qe-v06-stateful-pv-1
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: qe-v06-stateful-manual
  claimRef:
    namespace: qe-v06-workflows
    name: qe-v06-stateful-data-qe-v06-stateful-1
  hostPath:
    path: /tmp/qe-v06-stateful-1
    type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: qe-v06-stateful
  namespace: qe-v06-workflows
spec:
  clusterIP: None
  selector:
    app: qe-v06-stateful
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qe-v06-stateful
  namespace: qe-v06-workflows
spec:
  serviceName: qe-v06-stateful
  replicas: 2
  selector:
    matchLabels:
      app: qe-v06-stateful
  template:
    metadata:
      labels:
        app: qe-v06-stateful
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: qe-v06-stateful-data
              mountPath: /usr/share/nginx/html/data
  volumeClaimTemplates:
    - metadata:
        name: qe-v06-stateful-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: qe-v06-stateful-manual
        resources:
          requests:
            storage: 100Mi
