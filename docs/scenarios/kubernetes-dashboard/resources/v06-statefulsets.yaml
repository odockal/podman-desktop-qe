apiVersion: v1
kind: Namespace
metadata:
  name: qe-v06-workflows
---
apiVersion: v1
kind: Service
metadata:
  name: qe-v06-stateful
  namespace: qe-v06-workflows
spec:
  clusterIP: None
  selector:
    app: qe-v06-stateful
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qe-v06-stateful
  namespace: qe-v06-workflows
spec:
  serviceName: qe-v06-stateful
  replicas: 2
  selector:
    matchLabels:
      app: qe-v06-stateful
  template:
    metadata:
      labels:
        app: qe-v06-stateful
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
