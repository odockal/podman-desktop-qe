apiVersion: v1
kind: Namespace
metadata:
  name: qe-v06-workflows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qe-v06-web
  namespace: qe-v06-workflows
  labels:
    app: qe-v06-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qe-v06-web
  template:
    metadata:
      labels:
        app: qe-v06-web
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qe-v06-daemon
  namespace: qe-v06-workflows
  labels:
    app: qe-v06-daemon
spec:
  selector:
    matchLabels:
      app: qe-v06-daemon
  template:
    metadata:
      labels:
        app: qe-v06-daemon
    spec:
      containers:
        - name: daemon
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qe-v06-job
  namespace: qe-v06-workflows
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: busybox:1.36
          command: ["sh", "-c", "echo qe-v06-job-complete"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qe-v06-cron
  namespace: qe-v06-workflows
spec:
  schedule: "* * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cron
              image: busybox:1.36
              command: ["sh", "-c", "date; echo qe-v06-cron"]
