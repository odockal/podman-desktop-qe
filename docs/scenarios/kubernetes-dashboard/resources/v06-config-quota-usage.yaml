apiVersion: v1
kind: Pod
metadata:
  name: qe-v06-quota-usage
  namespace: qe-v06-workflows
spec:
  restartPolicy: Never
  containers:
    - name: consumer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 100m
        limits:
          cpu: 200m
